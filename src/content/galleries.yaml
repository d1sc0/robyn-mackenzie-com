galleries:
  - id: "highlights"
    title: "Selected Visual Explorations & Print Works"
    description: "A collection of speculative design touchpoints, lino-printed artifacts, and typography experiments."
    images:
      - src: "../../assets/images/gallery-1.png"
        alt: "Speculative policy and civic communication artifact"
        caption: "Explorations into human-centred measurement systems and civic graphic design."
      - src: "../../assets/images/gallery-2.png"
        alt: "Railway storytelling postcard mockups"
        caption: "Postcards for the 200 rail campaign collecting community memories across UK stations."
      - src: "../../assets/images/gallery-3.png"
        alt: "Service design diagram and blueprint mapping"
        caption: "Service touchpoint mapping for cultural institutions and public sector experiences."
      - src: "../../assets/images/gallery-4.png"
        alt: "Print typography and publication spread"
        caption: "Editorial layout, typography exploration, and dissertation publication extracts."
      - src: "../../assets/images/gallery-5.png"
        alt: "Resonance music visual identity"
        caption: "Identity work exploring sound, architecture, and sustainable community experiences."

  - id: "process-sketches"
    title: "Process, Research & Fieldwork"
    description: "Behind the scenes: user interviews, lino printing, and workshop outputs."
    images:
      - src: "../../assets/images/work-tally.png"
        alt: "Lino print process for Tally campaign"
        caption: "Handmade lino-printed icons developed for public engagement."
      - src: "../../assets/images/work-200.png"
        alt: "Postcard prompt distribution at stations"
        caption: "Physical prompt testing on station concourses."
      - src: "../../assets/images/work-resonance.png"
        alt: "Visual identity system for Resonance"
        caption: "Visual hierarchy and motion tests for live venues."
